name: NYR kernel build

on:
  push:
    branches:
      - main
      - codespaces-development
      - import/nyr-bundle
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential
      - name: Preflight
        run: make preflight
      - name: Build kernel
        run: make
      - name: Verify ELF output
        run: file build/nyr-kernel.elf
